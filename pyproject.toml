[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ihost-bridge"
version = "0.4.0"
description = "Bridge non-eWeLink appliances (Midea AC, heat pump, Huawei solar, TP-Link Deco, ...) into a SONOFF iHost / eWeLink CUBE as native devices"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6",
    "midea-local>=12",
    "tplink-deco-api>=2.1.1",
]

[project.scripts]
ihost-bridge = "bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.setuptools.package-data]
bridge = ["static/*.html"]
